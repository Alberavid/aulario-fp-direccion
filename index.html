<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aulario FP</title>
    <style>
:root {
  --bg: #f5f7fb;
  --panel: #ffffff;
  --ink: #283345;
  --muted: #8390a5;
  --line: #e8edf5;
  --navy: #121a2d;
  --violet: #5a4df1;
  --violet-soft: #eef0ff;
  --green: #46c28a;
  --red: #c43c55;
  --shadow: 0 22px 48px rgba(39, 48, 67, 0.13);
  --soft-shadow: 0 12px 26px rgba(39, 48, 67, 0.1);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: radial-gradient(circle at 50% -140px, #ffffff 0, #f5f7fb 330px);
  color: var(--ink);
  font-family:
    Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
    sans-serif;
  letter-spacing: 0;
}

button,
input,
select {
  font: inherit;
}

h1,
h2,
h3,
p {
  margin: 0;
}

.topbar {
  display: grid;
  grid-template-columns: auto minmax(220px, 1fr) auto;
  align-items: center;
  gap: 16px;
  min-height: 116px;
  padding: 24px clamp(18px, 6vw, 96px);
  background: var(--navy);
  color: #fff;
}

.brand-mark {
  display: grid;
  place-items: center;
  width: 54px;
  height: 54px;
  border-radius: 18px;
  background: linear-gradient(145deg, #6957ff, #4e40dd);
  box-shadow: 0 12px 26px rgba(86, 70, 230, 0.34);
  font-size: 1.45rem;
  font-weight: 900;
}

.brand-copy {
  min-width: 0;
}

h1 {
  color: #fff;
  font-size: clamp(1.45rem, 3vw, 2.1rem);
  font-weight: 950;
  line-height: 1.05;
  text-transform: uppercase;
}

h1 em {
  color: #8d88ff;
  font-style: italic;
}

.eyebrow {
  margin-top: 6px;
  color: var(--green);
  font-size: 0.76rem;
  font-weight: 950;
  text-transform: uppercase;
}

main {
  padding: 30px clamp(16px, 5vw, 84px) 54px;
}

.file-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  justify-content: flex-end;
}

.file-input {
  inline-size: 1px;
  block-size: 1px;
  position: absolute;
  opacity: 0;
  overflow: hidden;
}

.button,
.tab {
  min-height: 44px;
  border: 1px solid transparent;
  border-radius: 999px;
  cursor: pointer;
  font-weight: 950;
  padding: 0 22px;
  text-transform: uppercase;
  transition:
    transform 160ms ease,
    box-shadow 160ms ease,
    border-color 160ms ease;
}

.button:hover,
.tab:hover {
  transform: translateY(-1px);
}

.button.primary {
  background: linear-gradient(135deg, #6757f4, #5242df);
  box-shadow: 0 14px 24px rgba(89, 75, 232, 0.26);
  color: #fff;
}

.button.light {
  background: #fff;
  color: #1c2638;
  box-shadow: 0 10px 22px rgba(15, 23, 42, 0.18);
}

.button.compact {
  align-self: end;
  min-height: 50px;
  background: #eef2f8;
  color: #46556b;
}

.filters,
.status-band,
.kpis,
.view-switch,
.view {
  max-width: 1460px;
  margin-inline: auto;
}

.filters {
  display: grid;
  grid-template-columns: repeat(3, minmax(180px, 1fr));
  gap: 22px;
  margin-top: 0;
  padding: 38px;
  border: 1px solid var(--line);
  border-radius: 34px;
  background: rgba(255, 255, 255, 0.94);
  box-shadow: var(--shadow);
}

.filters label {
  min-width: 0;
}

.label,
.filters span,
.kpis span,
.entity-label {
  display: block;
  color: #9aa7ba;
  font-size: 0.74rem;
  font-weight: 950;
  text-transform: uppercase;
}

.filters select,
.filters input {
  width: 100%;
  min-height: 58px;
  margin-top: 12px;
  border: 1px solid #e2e8f2;
  border-radius: 999px;
  background: #f2f5fa;
  color: #334155;
  font-weight: 900;
  padding: 0 22px;
  text-transform: uppercase;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.7);
}

.filters input {
  text-transform: none;
}

.filters {
  grid-template-columns: repeat(12, minmax(0, 1fr));
  gap: 28px 26px;
  border-radius: 34px;
  background: rgba(255, 255, 255, 0.98);
}

.filters > label,
.filters > .filter-group {
  grid-column: span 3;
  min-width: 0;
}

.filter-span-4 {
  grid-column: span 4 !important;
}

.filter-span-3 {
  grid-column: span 3 !important;
}

.native-segment-source {
  display: none;
}

.segmented-control {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 12px;
  border-radius: 999px;
  background: #f0f3f9;
  padding: 6px;
}

.segmented-days {
  border-radius: 28px;
}

.segmented-option {
  min-height: 42px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: #596477;
  cursor: pointer;
  font-weight: 950;
  padding: 0 20px;
  text-transform: uppercase;
}

.segmented-option.active {
  background: linear-gradient(135deg, #5565ff, #4b46ed);
  box-shadow: 0 10px 18px rgba(77, 83, 236, 0.28);
  color: #fff;
}

.occupancy-filter {
  grid-column: span 4 !important;
}

.range-head {
  display: flex;
  justify-content: flex-end;
  margin-top: 2px;
  min-height: 20px;
}

.range-head output {
  color: #111827;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: 0.95rem;
  font-weight: 950;
}

.filters input[type="range"] {
  min-height: 22px;
  margin-top: 10px;
  padding: 0;
  accent-color: var(--violet);
  background: transparent;
  box-shadow: none;
}

.filter-summary {
  grid-column: 1 / span 8;
  align-self: end;
  color: #596477;
  font-size: 0.95rem;
  font-weight: 850;
}

.search-field input {
  padding-left: 46px;
  background:
    linear-gradient(#fff, #fff) padding-box,
    linear-gradient(135deg, #eef2ff, #dfe7f5) border-box;
}

.search-field {
  position: relative;
}

.search-field::after {
  content: "⌕";
  position: absolute;
  left: 18px;
  bottom: 14px;
  color: #657286;
  font-size: 1.35rem;
  line-height: 1;
}

.filters select:focus,
.filters input:focus,
.button:focus-visible,
.tab:focus-visible {
  outline: 4px solid rgba(90, 77, 241, 0.2);
  outline-offset: 2px;
}

.status-band {
  display: grid;
  grid-template-columns: minmax(180px, 1.3fr) repeat(2, minmax(140px, 0.7fr));
  gap: 1px;
  margin-top: 22px;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 22px;
  background: var(--line);
  box-shadow: var(--soft-shadow);
}

.status-band > div,
.kpis article {
  min-width: 0;
  background: #fff;
  padding: 16px 20px;
}

.status-band strong,
.kpis strong {
  display: block;
  margin-top: 6px;
  overflow-wrap: anywhere;
}

.kpis {
  display: grid;
  grid-template-columns: repeat(5, minmax(120px, 1fr));
  gap: 1px;
  margin-top: 18px;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 22px;
  background: var(--line);
  box-shadow: var(--soft-shadow);
}

.kpis strong {
  color: var(--violet);
  font-size: 2rem;
  line-height: 1;
}

.view-switch {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 24px;
  margin-bottom: 20px;
  width: fit-content;
  max-width: min(100%, 1460px);
  border-radius: 999px;
  background: #eef2f8;
  padding: 6px;
}

.tab {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: transparent;
  color: #66748a;
  padding-inline: 16px;
  text-transform: none;
}

.tab.active {
  background: #fff;
  box-shadow: 0 6px 14px rgba(39, 48, 67, 0.16);
  color: #101827;
}

.tab-icon {
  color: currentColor;
  font-size: 1.05rem;
  line-height: 1;
}

.empty-state {
  padding: 64px 24px;
  text-align: center;
  color: var(--muted);
}

.schedule-wrap {
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: 34px;
  background: #fff;
  box-shadow: var(--shadow);
}

.mobile-schedule {
  display: none;
}

body.is-mobile-layout .schedule-wrap {
  display: none !important;
}

body.is-mobile-layout .mobile-schedule {
  display: grid !important;
  gap: 18px;
}

.schedule-table {
  width: 1180px;
  min-width: 1180px;
  border-collapse: separate;
  border-spacing: 0;
  table-layout: fixed;
}

.schedule-table th,
.schedule-table td {
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  vertical-align: middle;
}

.schedule-table th:last-child,
.schedule-table td:last-child {
  border-right: 0;
}

.schedule-table tr:last-child th,
.schedule-table tr:last-child td {
  border-bottom: 0;
}

.schedule-table thead th {
  position: sticky;
  top: 0;
  z-index: 3;
  height: 86px;
  background: #f8faff;
  color: #9aa7ba;
  font-size: 0.78rem;
  font-style: italic;
  font-weight: 950;
  text-align: center;
  text-transform: uppercase;
}

.schedule-table thead th:first-child {
  left: 0;
  z-index: 4;
  width: 230px;
  text-align: left;
  padding-left: 30px;
}

.time-heading {
  color: var(--violet) !important;
  font-size: 1rem !important;
}

.time-heading::before {
  content: "◷";
  display: inline-grid;
  place-items: center;
  width: 18px;
  height: 18px;
  margin-right: 8px;
  border-radius: 50%;
  background: var(--violet-soft);
  color: var(--violet);
  font-size: 0.78rem;
  font-style: normal;
}

.day-divider {
  height: 46px;
  background: #eef1fb;
  color: var(--violet);
  font-size: 0.82rem;
  font-weight: 950;
  letter-spacing: 0;
  text-align: left;
  text-transform: uppercase;
  padding-left: 30px;
}

.room-cell {
  position: sticky;
  left: 0;
  z-index: 2;
  width: 230px;
  background: #fff;
  padding: 24px 30px;
  text-align: left;
}

.room-label {
  display: grid;
  gap: 8px;
  border-left: 5px solid var(--room-color);
  padding-left: 14px;
}

.room-label strong {
  color: #334155;
  font-size: 1.15rem;
  font-style: italic;
  font-weight: 950;
  overflow-wrap: anywhere;
  text-transform: uppercase;
}

.room-label span {
  color: #8c87ff;
  font-size: 0.72rem;
  font-style: italic;
  font-weight: 950;
  text-transform: uppercase;
}

.day-cell {
  min-height: 196px;
  background: #fbfcff;
  overflow: hidden;
  padding: 16px 14px;
}

.cell-stack {
  display: grid;
  gap: 12px;
  min-width: 0;
}

.session {
  --session-color: #3762e8;
  display: grid;
  gap: 14px;
  width: 100%;
  min-width: 0;
  min-height: 164px;
  border-radius: 28px;
  background:
    radial-gradient(circle at 88% 12%, rgba(255, 255, 255, 0.22), transparent 22%),
    linear-gradient(135deg, color-mix(in srgb, var(--session-color) 86%, #ffffff), color-mix(in srgb, var(--session-color) 76%, #0b1020));
  box-shadow: 0 12px 20px color-mix(in srgb, var(--session-color) 35%, transparent);
  color: #fff;
  padding: 20px 22px;
}

.session-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.session-room {
  max-width: 75%;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.16);
  color: #e8edff;
  font-size: 0.72rem;
  font-weight: 950;
  padding: 4px 10px;
  overflow: hidden;
  text-overflow: ellipsis;
  text-transform: uppercase;
  white-space: nowrap;
}

.session-site {
  flex: 0 0 auto;
  max-width: 56px;
  color: #eef2ff;
  font-size: 0.74rem;
  font-weight: 950;
  overflow: hidden;
  text-align: right;
  text-overflow: ellipsis;
  text-transform: uppercase;
  white-space: nowrap;
}

.session-subject {
  min-height: 48px;
  color: #fff;
  font-size: 0.9rem;
  font-style: italic;
  font-weight: 950;
  line-height: 1.18;
  overflow-wrap: anywhere;
  text-transform: uppercase;
}

.session-footer {
  display: grid;
  grid-template-columns: 40px minmax(0, 1fr) auto;
  align-items: center;
  gap: 12px;
  margin-top: auto;
  border-top: 1px solid rgba(255, 255, 255, 0.16);
  padding-top: 14px;
}

.session-contract {
  justify-self: end;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.18);
  color: #fff;
  font-size: 0.78rem;
  font-weight: 950;
  padding: 7px 10px;
}

.teacher-initial {
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.14);
  color: #fff;
  font-weight: 950;
}

.session-teacher {
  color: #eef2ff;
  font-size: 0.78rem;
  font-weight: 900;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.session-meta {
  color: rgba(255, 255, 255, 0.72);
  font-size: 0.72rem;
  font-weight: 800;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.muted-note {
  color: var(--muted);
  font-size: 0.95rem;
  padding: 22px;
}

.list-view {
  padding-top: 2px;
}

.entity-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 14px;
}

.occupancy-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 14px;
}

.occupancy-chart {
  margin-bottom: 16px;
}

.occupancy-chart-panel {
  border: 1px solid var(--line);
  border-radius: 28px;
  background: #fff;
  box-shadow: var(--shadow);
  padding: 24px;
}

.occupancy-chart-head {
  display: grid;
  grid-template-columns: minmax(0, 1.1fr) minmax(320px, 0.9fr);
  align-items: start;
  gap: 20px;
}

.occupancy-chart-head h2 {
  margin-top: 6px;
  color: #334155;
  font-size: clamp(1.35rem, 2vw, 1.9rem);
  font-weight: 950;
  line-height: 1.1;
}

.occupancy-chart-head p {
  margin-top: 8px;
  color: #657286;
  font-weight: 850;
  line-height: 1.35;
}

.occupancy-chart-kpis {
  display: grid;
  grid-template-columns: repeat(2, minmax(120px, 1fr));
  gap: 1px;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: var(--line);
}

.occupancy-chart-kpis div {
  min-width: 0;
  background: #f8faff;
  padding: 12px;
}

.occupancy-chart-kpis span {
  display: block;
  color: #8d99ac;
  font-size: 0.68rem;
  font-weight: 950;
  text-transform: uppercase;
}

.occupancy-chart-kpis strong {
  display: block;
  margin-top: 4px;
  color: var(--violet);
  font-size: 1.45rem;
  font-weight: 950;
  line-height: 1;
}

.occupancy-chart-tools {
  display: grid;
  gap: 12px;
}

.occupancy-percent-filter {
  display: grid;
  grid-template-columns: minmax(150px, 1fr) auto auto;
  align-items: end;
  gap: 10px;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: #f8faff;
  padding: 12px;
}

.occupancy-percent-filter label {
  min-width: 0;
}

.occupancy-percent-filter span {
  display: block;
  color: #8d99ac;
  font-size: 0.68rem;
  font-weight: 950;
  text-transform: uppercase;
}

.occupancy-percent-filter input {
  width: 100%;
  min-height: 42px;
  margin-top: 6px;
  border: 1px solid #dfe6f1;
  border-radius: 14px;
  background: #fff;
  color: #334155;
  font-weight: 950;
  padding: 0 12px;
}

.occupancy-percent-filter button {
  min-height: 42px;
  border: 0;
  border-radius: 14px;
  cursor: pointer;
  font-weight: 950;
  padding: 0 14px;
  text-transform: uppercase;
}

.occupancy-percent-filter button[type="submit"] {
  background: var(--violet);
  color: #fff;
}

.occupancy-percent-filter button[type="button"] {
  background: #e9eef7;
  color: #536176;
}

.occupancy-percent-filter button:disabled {
  cursor: not-allowed;
  opacity: 0.5;
}

.occupancy-percent-filter p {
  grid-column: 1 / -1;
  color: #657286;
  font-size: 0.82rem;
  font-weight: 850;
  line-height: 1.3;
}

.occupancy-chart-list {
  display: grid;
  gap: 12px;
  margin-top: 22px;
}

.occupancy-chart-row {
  display: grid;
  gap: 8px;
  border: 1px solid #edf1f8;
  border-radius: 18px;
  background: #fbfcff;
  padding: 13px 14px;
}

.occupancy-chart-row-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.occupancy-chart-row-top strong {
  min-width: 0;
  color: #334155;
  font-size: 0.95rem;
  font-weight: 950;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.occupancy-chart-row-top span {
  flex: 0 0 auto;
  border-radius: 999px;
  background: #eef2ff;
  color: var(--violet);
  font-weight: 950;
  padding: 5px 10px;
}

.occupancy-chart-track {
  overflow: hidden;
  height: 13px;
  border-radius: 999px;
  background: #e5ebf5;
}

.occupancy-chart-fill {
  display: block;
  width: var(--bar-width);
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, #6757f4, #2878d9);
}

.occupancy-chart-row.is-missing .occupancy-chart-fill {
  background: #cbd5e1;
}

.occupancy-chart-row p {
  color: #64748b;
  font-size: 0.82rem;
  font-weight: 850;
  line-height: 1.3;
}

.availability-panel {
  display: grid;
  gap: 18px;
}

.availability-controls {
  display: grid;
  grid-template-columns: repeat(3, minmax(180px, 1fr));
  gap: 14px;
  border: 1px solid var(--line);
  border-radius: 24px;
  background: #fff;
  box-shadow: var(--soft-shadow);
  padding: 18px;
}

.availability-controls span {
  display: block;
  color: #9aa7ba;
  font-size: 0.74rem;
  font-weight: 950;
  text-transform: uppercase;
}

.availability-controls select {
  width: 100%;
  min-height: 46px;
  margin-top: 8px;
  border: 1px solid #e2e8f2;
  border-radius: 14px;
  background: #f8faff;
  color: #334155;
  font-weight: 950;
  padding: 0 12px;
}

.availability-result {
  display: grid;
  gap: 14px;
}

.availability-summary {
  border-radius: 24px;
  background: var(--navy);
  color: #fff;
  padding: 22px;
}

.availability-summary h3 {
  font-size: 1.8rem;
  line-height: 1;
}

.availability-summary p {
  margin-top: 8px;
  color: #b9c3d6;
  font-weight: 850;
}

.availability-summary .availability-answer {
  margin-top: 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.1);
  color: #fff;
  font-size: 1rem;
  line-height: 1.35;
  padding: 12px 14px;
}

.room-chip-list {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.room-chip-list span {
  border-radius: 999px;
  background: #eef2ff;
  color: var(--violet);
  font-weight: 950;
  padding: 9px 13px;
}

.availability-subtitle {
  color: #334155;
  font-size: 1rem;
  font-weight: 950;
  text-transform: uppercase;
}

.busy-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 12px;
}

.free-room-hours-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 12px;
}

.free-room-hours-list article {
  display: grid;
  gap: 8px;
  border-radius: 18px;
  background: #fff;
  box-shadow: var(--soft-shadow);
  padding: 16px;
}

.free-room-hours-list strong {
  color: #334155;
  font-size: 1.08rem;
  font-weight: 950;
}

.free-room-hours-list span {
  color: #8c87ff;
  font-size: 0.78rem;
  font-weight: 950;
  text-transform: uppercase;
}

.free-room-hours-list p {
  color: #526174;
  font-weight: 900;

async function boot() {
  state.teacherTargets = readTeacherTargets();
  await primeBundledCsv();
  if (state.defaultCsv) {
    localStorage.removeItem(storageKey);
    loadCsvText(state.defaultCsv, "PLANIFICADOR DE AULAS (1).csv", new Date().toISOString(), false);
    return;
  }
  const stored = readStoredCsv();
  if (stored?.text) {
    loadCsvText(stored.text, stored.name || "CSV guardado", stored.loadedAt);
    return;
  }
  render();
}

async function primeBundledCsv() {
  try {
    const response = await fetch("data/planificador.csv", { cache: "no-store" });
    if (response.ok) {
      state.defaultCsv = await response.text();
      return;
    }
  } catch {
    // Local previews opened as file:// can block loading data/planificador.csv.
  }
  state.defaultCsv = readEmbeddedCsv();
}

function readEmbeddedCsv() {
  const node = document.querySelector("#bundledCsv");
  if (!node?.textContent) return "";
  try {
    return JSON.parse(node.textContent);
  } catch {
    return "";
  }
}

function readStoredCsv() {
  try {
    return JSON.parse(localStorage.getItem(storageKey));
  } catch {
    return null;
  }
}

function readTeacherTargets() {
  try {
    return JSON.parse(localStorage.getItem(targetStorageKey)) || {};
  } catch {
    return {};
  }
}

function saveTeacherTargets() {
  localStorage.setItem(targetStorageKey, JSON.stringify(state.teacherTargets));
}

function handleFile(event) {
  const [file] = event.target.files;
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const loadedAt = new Date().toISOString();
    const text = String(reader.result || "");
    localStorage.setItem(storageKey, JSON.stringify({ text, name: file.name, loadedAt }));
    loadCsvText(text, file.name, loadedAt);
    elements.csvInput.value = "";
  };
  reader.readAsText(file, "utf-8");
}

function loadBundledCsv() {
  if (!state.defaultCsv) {
    setError("No se ha encontrado el CSV inicial. Carga un archivo para continuar.");
    return;
  }
  localStorage.removeItem(storageKey);
  loadCsvText(state.defaultCsv, "PLANIFICADOR DE AULAS (1).csv", new Date().toISOString(), false);
}

function loadCsvText(text, name, loadedAt = new Date().toISOString(), persist = true) {
  try {
    const rows = normalizeRows(parseDelimitedText(text));
    if (!rows.length) throw new Error("El CSV no contiene filas válidas.");
    state.allRows = rows;
    state.sourceName = name;
    state.loadDate = new Date(loadedAt);
    state.error = "";
    if (persist) {
      localStorage.setItem(storageKey, JSON.stringify({ text, name, loadedAt }));
    }
    resetFilterOptions();
    render();
  } catch (error) {
    state.allRows = [];
    state.sourceName = "";
    state.loadDate = null;
    state.error = error.message;
    resetFilterOptions();
    render();
  }
}

function parseDelimitedText(text) {
  const cleanText = text.replace(/^\uFEFF/, "").replace(/\r\n/g, "\n").replace(/\r/g, "\n");
  const delimiter = detectDelimiter(cleanText);
  const records = [];
  let row = [];
  let field = "";
  let quoted = false;

  for (let i = 0; i < cleanText.length; i += 1) {
    const char = cleanText[i];
    const next = cleanText[i + 1];

    if (char === '"') {
      if (quoted && next === '"') {
        field += '"';
        i += 1;
      } else {
        quoted = !quoted;
      }
      continue;
    }

    if (char === delimiter && !quoted) {
      row.push(field);
      field = "";
      continue;
    }

    if (char === "\n" && !quoted) {
      row.push(field);
      if (row.some((cell) => cell.trim() !== "")) records.push(row);
      row = [];
      field = "";
      continue;
    }

    field += char;
  }

  row.push(field);
  if (row.some((cell) => cell.trim() !== "")) records.push(row);
  return records;
}

function detectDelimiter(text) {
  const firstLine = text.split(/\r?\n/, 1)[0] || "";
  const candidates = [";", ",", "\t"];
  return candidates
    .map((delimiter) => ({
      delimiter,
      count: firstLine.split(delimiter).length,
    }))
    .sort((a, b) => b.count - a.count)[0].delimiter;
}

function normalizeRows(records) {
  const [headerRow, ...bodyRows] = records;
  if (!headerRow) return [];
  const headers = headerRow.map((header) => normalizeHeader(header));
  const indexes = {
    time: findColumn(headers, ["horario", "hora"]),
    day: findColumn(headers, ["dia", "día"]),
    floor: findColumn(headers, ["planta"]),
    room: findColumn(headers, ["aula"]),
    subject: findColumn(headers, ["asignatura"]),
    cycle: findColumn(headers, ["ciclo master", "ciclo / master", "ciclo"]),
    course: findColumn(headers, ["curso"]),
    group: findColumn(headers, ["grupo"]),
    teacher: findColumn(headers, ["profesor"]),
    site: findColumn(headers, ["sede"]),
    contractedOccupancy: findColumn(headers, ["ocupacion contratada", "ocupación contratada"]),
  };

  const missing = Object.entries(indexes)
    .filter(([key, index]) => key !== "contractedOccupancy" && index === -1)
    .map(([key]) => requiredLabels[key]);
  if (missing.length) {
    throw new Error(`Faltan columnas: ${missing.join(", ")}.`);
  }

  return bodyRows
    .map((row, index) => {
      const time = clean(row[indexes.time]);
      const day = normalizeDay(row[indexes.day]);
      const room = clean(row[indexes.room]) || "Sin aula";
      const site = normalizeSite(row[indexes.site]);
      const subject = clean(row[indexes.subject]);
      const teacher = clean(row[indexes.teacher]);
      const minutes = timeToMinutes(time);
      const durationMinutes = durationForTime(time);

      return {
        id: `${index}-${day}-${time}-${room}-${teacher}`,
        sourceIndex: index,
        time,
        minutes,
        durationMinutes,
        shift: shiftFromMinutes(minutes),
        day,
        floor: clean(row[indexes.floor]),
        room,
        subject,
        cycle: clean(row[indexes.cycle]),
        course: clean(row[indexes.course]),
        group: clean(row[indexes.group]),
        teacher,
        site,
        contractedOccupancyPercent:
          indexes.contractedOccupancy === -1 ? null : parseContractedOccupancy(row[indexes.contractedOccupancy]),
        searchText: "",
      };
    })
    .filter((item) => item.time && item.day && item.site && item.minutes !== null)
    .map((item) => ({
      ...item,
      searchText: normalizeForSearch(
        [
          item.time,
          item.day,
          item.room,
          item.subject,
          item.cycle,
          item.course,
          item.group,
          item.teacher,
          item.site,
          item.floor,
          item.shift,
        ].join(" ")
      ),
    }))
    .sort(sortSessions);
}

const requiredLabels = {
  time: "Horario",
  day: "Día",
  floor: "Planta",
  room: "Aula",
  subject: "Asignatura",
  cycle: "Ciclo / Master",
  course: "Curso",
  group: "Grupo",
  teacher: "Profesor",
  site: "Sede",
};

function normalizeHeader(value = "") {
  return normalizeForSearch(value).replace(/\s+/g, " ").trim();
}

function findColumn(headers, options) {
  const normalized = options.map((option) => normalizeHeader(option));
  return headers.findIndex((header) => normalized.includes(header));
}

function clean(value = "") {
  return String(value).replace(/\uFEFF/g, "").trim();
}

function normalizeForSearch(value = "") {
  return String(value)
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .trim();
}

function normalizeDay(value = "") {
  const raw = normalizeForSearch(value);
  const match = dayOrder.find((day) => normalizeForSearch(day) === raw);
  return match || clean(value);
}

function normalizeSite(value = "") {
  const raw = clean(value);
  const key = normalizeForSearch(raw);
  if (key === "moncloa") return "Moncloa";
  if (key === "barajas") return "Barajas";
  return raw;
}

function timeToMinutes(value = "") {
  const match = clean(value).match(/^(\d{1,2}):(\d{2})$/);
  if (!match) return null;
  return Number(match[1]) * 60 + Number(match[2]);
}

function shiftFromMinutes(minutes) {
  if (minutes === null) return "";
  if (minutes < 14 * 60 + 30) return "Mañana";
  if (minutes < 18 * 60) return "Tarde";
  return "Tarde-noche";
}

function durationForTime(time) {
  return sixtyMinuteSlots.has(clean(time)) ? 60 : defaultClassMinutes;
}

function parseContractedOccupancy(value = "") {
  const raw = clean(value).replace("%", "").replace(",", ".");
  if (!raw) return null;
  const number = Number(raw);
  if (!Number.isFinite(number) || number <= 0) return null;
  return number <= 1 ? number * 100 : number;
}

function sortSessions(a, b) {
  return (
    dayOrder.indexOf(a.day) - dayOrder.indexOf(b.day) ||
    a.minutes - b.minutes ||
    a.site.localeCompare(b.site, "es") ||
    a.room.localeCompare(b.room, "es") ||
    a.teacher.localeCompare(b.teacher, "es")
  );
}

function resetFilterOptions() {
  fillSelect(elements.sedeFilter, "Todas", unique(state.allRows, "site"));
  fillSelect(elements.dayFilter, "Todos", dayOrder.filter((day) => state.allRows.some((row) => row.day === day)));

  fillSelect(elements.floorFilter, "Todas", unique(state.allRows, "floor"));
  fillSelect(elements.roomFilter, "Todas", unique(state.allRows, "room"));
  fillSelect(elements.teacherFilter, "Todos", unique(state.allRows, "teacher"));
  fillSelect(elements.subjectFilter, "Todas", unique(state.allRows, "subject"));
  fillSelect(elements.cycleFilter, "Todos los ciclos", unique(state.allRows, "cycle"));
  fillSelect(elements.courseFilter, "Todos los cursos", unique(state.allRows, "course"));
  fillSelect(elements.groupFilter, "Todos los grupos", unique(state.allRows, "group"));
  fillSelect(elements.freeDaySelect, "Selecciona día", dayOrder.filter((day) => state.allRows.some((row) => row.day === day)));
  elements.freeDaySelect.insertBefore(new Option("Todos los días", "__all__"), elements.freeDaySelect.options[1] || null);
  fillSelect(
    elements.freeTimeSelect,
    "Selecciona hora",
    [...new Set(state.allRows.map((row) => row.time).filter(Boolean))].sort((a, b) => timeToMinutes(a) - timeToMinutes(b))
  );
  elements.freeTimeSelect.insertBefore(new Option("Todas las horas", "__all__"), elements.freeTimeSelect.options[1] || null);
  fillSelect(elements.freeSiteSelect, "Todas las sedes", unique(state.allRows, "site"));
  elements.searchInput.value = "";
  state.occupancyContractMax = "100";

function fillSelect(select, emptyLabel, values) {
  select.replaceChildren();
  select.append(new Option(emptyLabel, ""));
  values.forEach((value) => select.append(new Option(value, value)));
}

function unique(rows, key) {
  return [...new Set(rows.map((row) => row[key]).filter(Boolean))].sort((a, b) => a.localeCompare(b, "es"));
}

function render() {
  updateChrome();
  state.filteredRows = getFilteredRows();
  const hasRows = state.allRows.length > 0;
  if (isTeacherPortal && !teacherAllowedViews.has(state.activeView)) state.activeView = "schedule";
  updateResponsiveMode();
  elements.emptyState.hidden = hasRows;
  elements.scheduleView.hidden = !hasRows || state.activeView !== "schedule";
  elements.roomsView.hidden = !hasRows || state.activeView !== "rooms";
  elements.teachersView.hidden = !hasRows || state.activeView !== "teachers";
  elements.occupancyView.hidden = isTeacherPortal || !hasRows || state.activeView !== "occupancy";
  elements.availabilityView.hidden = isTeacherPortal || !hasRows || state.activeView !== "availability";
  elements.subjectsView.hidden = !hasRows || state.activeView !== "subjects";
  updateTabs();
  renderKpis();
  updateFilterUi();
  renderSchedule();
  renderEntityViews();
}

function updateResponsiveMode() {
  document.body.classList.toggle("is-mobile-layout", window.matchMedia("(max-width: 900px)").matches);
}

function updateChrome() {
  elements.consultedAt.textContent = new Date().toLocaleString("es-ES", {
    weekday: "long",
    day: "2-digit",
    month: "long",
    year: "numeric",
    hour: "2-digit",
    minute: "2-digit",
  });
  if (state.error) {
    elements.fileName.innerHTML = `<span class="error">${escapeHtml(state.error)}</span>`;
    elements.loadTime.textContent = "-";
    elements.rowCount.textContent = "0";
    return;
  }
  elements.fileName.textContent = state.sourceName || "Sin datos";
  elements.loadTime.textContent = state.loadDate ? state.loadDate.toLocaleString("es-ES") : "-";
  elements.rowCount.textContent = String(state.allRows.length);
}

function setError(message) {
  state.error = message;
  updateChrome();
}

function getFilteredRows() {
  const query = normalizeForSearch(elements.searchInput.value);
  const maxOccupancy = parseContractedOccupancy(state.occupancyContractMax);
  const occupancyIsActive = Number.isFinite(maxOccupancy) && maxOccupancy < 100;
  return state.allRows.filter((row) => {
    const contractedPercent = contractedPercentForTeacher(row.teacher);
    return (
      filterMatch(row.site, elements.sedeFilter.value) &&
      filterMatch(row.day, elements.dayFilter.value) &&
      filterMatch(row.shift, elements.shiftFilter.value) &&
      filterMatch(row.floor, elements.floorFilter.value) &&
      filterMatch(row.room, elements.roomFilter.value) &&
      filterMatch(row.teacher, elements.teacherFilter.value) &&
      filterMatch(row.subject, elements.subjectFilter.value) &&
      filterMatch(row.cycle, elements.cycleFilter.value) &&
      filterMatch(row.course, elements.courseFilter.value) &&
      filterMatch(row.group, elements.groupFilter.value) &&
      (!occupancyIsActive || (Number.isFinite(contractedPercent) && contractedPercent <= maxOccupancy)) &&
      (!query || row.searchText.includes(query))
    );
  });
}

function updateFilterUi() {
  segmentedButtons.forEach((button) => {
    const target = elements[button.dataset.filterTarget];
    button.classList.toggle("active", target?.value === button.dataset.filterValue);
  });

  const value = clean(state.occupancyContractMax) || "100";
  elements.occupancyRange.value = value;
  elements.occupancyRangeValue.textContent = value === "100" ? "0% - 100%" : `0% - ${value}%`;

  if (elements.filterSummary) {
    const sites = unique(state.filteredRows, "site");
    const siteText = !sites.length ? "sin sedes" : sites.length === 1 ? sites[0] : "todas las sedes";
    elements.filterSummary.textContent = `${state.filteredRows.length} sesiones · ${unique(state.filteredRows, "teacher").length} profesores · ${siteText}`;
  }
}

function filterMatch(value, selected) {
  return !selected || value === selected;
}

function updateTabs() {
  elements.tabs.forEach((tab) => {
    tab.hidden = isTeacherPortal && !teacherAllowedViews.has(tab.dataset.view);
    tab.classList.toggle("active", tab.dataset.view === state.activeView);
  });
}

function renderKpis() {
  const rows = state.filteredRows;
  elements.kpiSessions.textContent = String(rows.length);
  elements.kpiRooms.textContent = String(unique(rows, "room").length);
  elements.kpiTeachers.textContent = String(unique(rows, "teacher").length);
  elements.kpiSubjects.textContent = String(unique(rows, "subject").length);
  elements.kpiSites.textContent = String(unique(rows, "site").length);
}

function renderSchedule() {
  elements.scheduleBody.replaceChildren();
  const rows = state.filteredRows;
  const visibleDays = elements.dayFilter.value ? [elements.dayFilter.value] : dayOrder;
  const times = [...new Set(rows.map((row) => row.time))]
    .sort((a, b) => timeToMinutes(a) - timeToMinutes(b));
  sizeScheduleTable(times.length);
  renderScheduleHead(times);
  renderMobileSchedule(rows, visibleDays);

  if (!times.length) {
    const tr = document.createElement("tr");
    const td = document.createElement("td");
    td.colSpan = visibleDays.length + 1;
    td.className = "muted-note";
    td.textContent = "No hay sesiones con los filtros actuales.";
    tr.append(td);
    elements.scheduleBody.append(tr);
    return;
  }

  visibleDays.forEach((day) => {
    const dayRows = rows.filter((row) => row.day === day);
    if (!dayRows.length) return;

    if (!elements.dayFilter.value) {
      const dayDivider = document.createElement("tr");
      const dayCell = document.createElement("th");
      dayCell.className = "day-divider";
      dayCell.colSpan = times.length + 1;
      dayCell.textContent = day;
      dayDivider.append(dayCell);
      elements.scheduleBody.append(dayDivider);
    }

    unique(dayRows, "room").forEach((roomName) => {
      const roomRows = dayRows.filter((row) => row.room === roomName);
      const tr = document.createElement("tr");
      const roomCell = document.createElement("th");
      roomCell.scope = "row";
      roomCell.className = "room-cell";
      roomCell.style.setProperty("--room-color", colorForRoom(roomName));
      roomCell.append(createRoomLabel(roomName, roomRows, day));
      tr.append(roomCell);

      times.forEach((time) => {
        const td = document.createElement("td");
        td.className = "day-cell";
        const stack = document.createElement("div");
        stack.className = "cell-stack";
        roomRows
          .filter((row) => row.time === time)
          .sort(sortSessions)
          .forEach((session) => stack.append(createSessionCard(session)));
        td.append(stack);
        tr.append(td);
      });

      elements.scheduleBody.append(tr);
    });
  });
}

function createMobileScheduleContainer() {
  const container = document.createElement("div");
  container.id = "mobileSchedule";
  container.className = "mobile-schedule";
  const scheduleView = document.querySelector("#scheduleView");
  const scheduleWrap = document.querySelector(".schedule-wrap");
  if (scheduleView && scheduleWrap) scheduleWrap.after(container);
  return container;
}

function renderMobileSchedule(rows, visibleDays) {
  elements.mobileSchedule.replaceChildren();

  if (!rows.length) {
    const note = document.createElement("p");
    note.className = "muted-note";
    note.textContent = "No hay sesiones con los filtros actuales.";
    elements.mobileSchedule.append(note);
    return;
  }

  visibleDays.forEach((day) => {
    const dayRows = rows.filter((row) => row.day === day);
    if (!dayRows.length) return;

    const section = document.createElement("section");
    section.className = "mobile-day-section";

    const title = document.createElement("h2");
    title.className = "mobile-day-title";
    title.textContent = day;
    section.append(title);

    unique(dayRows, "room").forEach((roomName) => {
      const roomRows = dayRows.filter((row) => row.room === roomName).sort(sortSessions);
      const roomBlock = document.createElement("article");
      roomBlock.className = "mobile-room";
      roomBlock.style.setProperty("--room-color", colorForRoom(roomName));

      const header = document.createElement("header");
      header.className = "mobile-room-head";
      const room = document.createElement("strong");
      room.textContent = roomName;
      const meta = document.createElement("span");
      meta.textContent = [
        `Sede: ${unique(roomRows, "site").join(", ") || "Sin indicar"}`,
        unique(roomRows, "floor").length ? `Planta ${unique(roomRows, "floor").join(", ")}` : "",
      ]
        .filter(Boolean)
        .join(" · ");
      header.append(room, meta);

      const sessions = document.createElement("div");
      sessions.className = "mobile-session-list";
      roomRows.forEach((session) => sessions.append(createMobileSessionCard(session)));

      roomBlock.append(header, sessions);
      section.append(roomBlock);
    });

    elements.mobileSchedule.append(section);
  });
}

function createMobileSessionCard(session) {
  const card = document.createElement("article");
  card.className = "mobile-session";
  card.style.setProperty("--session-color", colorForSubject(session.subject));

  const top = document.createElement("div");
  top.className = "mobile-session-top";
  const time = document.createElement("span");
  time.textContent = `${session.time} · ${formatHours(session.durationMinutes)}`;
  const cycle = document.createElement("span");
  cycle.textContent = [session.cycle, session.course, session.group ? `Grupo ${session.group}` : ""]
    .filter(Boolean)
    .join(" · ");
  top.append(time, cycle);

  const subject = document.createElement("strong");
  subject.textContent = session.subject || "Sin asignatura";

  const teacher = document.createElement("p");
  const contractedPercent = contractedPercentForTeacher(session.teacher);
  teacher.textContent = `${session.teacher || "Profesor sin indicar"} · ${session.room}${
    contractedPercent ? ` · ${formatPercent(contractedPercent)}` : ""
  }`;

  card.append(top, subject, teacher);
  return card;
}

function sizeScheduleTable(timeCount) {
  const roomColumnWidth = 230;
  const timeColumnWidth = 310;
  const width = roomColumnWidth + Math.max(timeCount, 1) * timeColumnWidth;
  elements.scheduleTable.style.width = `${width}px`;
  elements.scheduleTable.style.minWidth = `${width}px`;
}

function renderScheduleHead(times = []) {
  const tr = document.createElement("tr");
  const empty = document.createElement("th");
  empty.textContent = "Aula";
  tr.append(empty);
  times.forEach((time) => {
    const th = document.createElement("th");
    th.scope = "col";
    th.className = "time-heading";
    th.textContent = time;
    tr.append(th);
  });
  elements.scheduleHead.replaceChildren(tr);
}

function createRoomLabel(roomName, rows, day) {
  const wrap = document.createElement("div");
  wrap.className = "room-label";

  const room = document.createElement("strong");
  room.textContent = roomName;

  const site = document.createElement("span");
  site.textContent = `Sede: ${unique(rows, "site").join(", ") || "Sin indicar"}`;

  const meta = document.createElement("span");
  meta.textContent = [
    elements.dayFilter.value ? "" : day,
    unique(rows, "floor").length ? `Planta ${unique(rows, "floor").join(", ")}` : "",
  ]
    .filter(Boolean)
    .join(" · ");

  wrap.append(room, site);
  if (meta.textContent) wrap.append(meta);
  return wrap;
}

function createSessionCard(session) {
  const fragment = elements.sessionTemplate.content.cloneNode(true);
  const card = fragment.querySelector(".session");
  const room = fragment.querySelector(".session-room");
  const site = fragment.querySelector(".session-site");
  const subject = fragment.querySelector(".session-subject");
  const meta = fragment.querySelector(".session-meta");
  const teacher = fragment.querySelector(".session-teacher");
  const initial = fragment.querySelector(".teacher-initial");
  const contract = fragment.querySelector(".session-contract");

  card.dataset.site = siteKey(session.site);
  card.style.setProperty("--session-color", colorForSubject(session.subject));
  room.textContent = [session.cycle, session.course].filter(Boolean).join(" ") || session.room;
  site.textContent = session.group || session.site;
  subject.textContent = session.subject || "Sin asignatura";
  meta.textContent = [
    session.time,
    formatHours(session.durationMinutes),
    session.site,
    session.floor ? `Planta ${session.floor}` : "",
    session.shift,
  ]
    .filter(Boolean)
    .join(" · ");
  initial.textContent = teacherInitial(session.teacher);
  teacher.textContent = session.teacher || "Profesor sin indicar";
  const contractedPercent = contractedPercentForTeacher(session.teacher);
  contract.textContent = contractedPercent ? formatPercent(contractedPercent) : "";
  contract.hidden = !contractedPercent;
  return fragment;
}

function colorForRoom(roomName = "") {
  return colorFromPalette(roomName);
}

function colorForSubject(subjectName = "") {
  return colorFromPalette(subjectName);
}

function colorFromPalette(value = "") {
  const key = normalizeForSearch(value);
  let hash = 0;
  for (let i = 0; i < key.length; i += 1) {
    hash = (hash * 31 + key.charCodeAt(i)) % 9973;
  }
  return subjectPalette[hash % subjectPalette.length];
}

function teacherInitial(name = "") {
  const value = clean(name);
  return value ? value[0].toUpperCase() : "?";
}

function siteKey(value) {
  const key = normalizeForSearch(value);
  if (key === "barajas") return "barajas";
  if (key === "moncloa") return "moncloa";
  return "other";
}

function renderEntityViews() {
  renderEntityList(elements.roomsList, groupBy(state.filteredRows, "room"), buildRoomEntity);
  renderEntityList(elements.teachersList, groupBy(state.filteredRows, "teacher"), buildTeacherEntity);
  if (!isTeacherPortal) {
    renderOccupancyView();
    renderAvailabilityView();
  }
  renderEntityList(elements.subjectsList, groupBy(state.filteredRows, "subject"), buildSubjectEntity);
}

function groupBy(rows, key) {
  return rows.reduce((groups, row) => {
    const value = row[key] || "Sin indicar";
    if (!groups.has(value)) groups.set(value, []);
    groups.get(value).push(row);
    return groups;
  }, new Map());
}

function contractRowsForTeacher(name) {
  return state.allRows.filter((row) => row.teacher === name);
}

function contractedPercentForTeacher(name) {
  return contractedPercentForRows(contractRowsForTeacher(name));
}

function renderEntityList(container, groups, builder) {
  container.replaceChildren();
  if (!groups.size) {
    const note = document.createElement("p");
    note.className = "muted-note";
    note.textContent = "No hay resultados con los filtros actuales.";
    container.append(note);
    return;
  }
  [...groups.entries()]
    .sort((a, b) => a[0].localeCompare(b[0], "es"))
    .forEach(([name, rows]) => container.append(builder(name, rows)));
}

function buildRoomEntity(name, rows) {
  if (isTeacherPortal) {
    return createEntityCard({
      kind: "room",
      color: colorForRoom(name),
      title: name,
      label: `${rows.length} clases registradas`,
      chips: [formatUnique(rows, "site"), formatUnique(rows, "floor", "Planta"), formatUnique(rows, "shift")],
      lines: topValues(rows, "teacher", 4).map(([teacher, count]) => `${teacher} · ${count} clases`),
    });
  }

  const capacity = roomCapacitySlots(name, rows);
  const occupied = roomOccupiedSlots(rows);
  const percent = capacity ? Math.round((occupied / capacity) * 100) : 0;
  return createEntityCard({
    kind: "room",
    color: colorForRoom(name),
    title: name,
    label: "Ocupación del aula",
    metric: {
      label: `${occupied} de ${capacity} franjas`,
      value: `${percent}%`,
      percent,
    },
    chips: [
      `${rows.length} clases`,
      formatUnique(rows, "site"),
      formatUnique(rows, "floor", "Planta"),
      formatUnique(rows, "shift"),
    ],
    lines: topValues(rows, "teacher", 4).map(([teacher, count]) => `${teacher} · ${count} clases`),
  });
}

function buildTeacherEntity(name, rows) {
  const days = unique(rows, "day").length;
  const rooms = unique(rows, "room").length;
  if (isTeacherPortal) {
    return createEntityCard({
      kind: "teacher",
      color: colorForSubject(topValues(rows, "subject", 1)[0]?.[0] || name),
      title: name,
      label: `${rows.length} clases registradas`,
      chips: [
        formatUnique(rows, "site"),
        `${rooms} ${rooms === 1 ? "aula" : "aulas"}`,
        `${days} ${days === 1 ? "día" : "días"}`,
        formatUnique(rows, "shift"),
      ],
      lines: topValues(rows, "subject", 6).map(([subject, count]) => `${subject} · ${count} clases`),
    });
  }

  const totalMinutes = sumDuration(rows);
  const contractRows = contractRowsForTeacher(name);
  const contractedPercent = contractedPercentForRows(contractRows);
  const targetHours = getTeacherTargetHours(name, contractRows);
  const occupancy = occupancyPercent(totalMinutes, targetHours);
  const labelSuffix = elements.dayFilter.value ? "en selección" : "semanales";
  return createEntityCard({
    kind: "teacher",
    color: colorForSubject(topValues(rows, "subject", 1)[0]?.[0] || name),
    title: name,
    label: "Ocupación contratada",
    metric: {
      label: `${formatHours(totalMinutes)} ${labelSuffix} · carga real ${occupancy}%`,
      value: contractedPercent ? formatPercent(contractedPercent) : "-",
      percent: contractedPercent || 0,
    },
    chips: [
      `${rows.length} clases`,
      contractedPercent ? `${formatPercent(contractedPercent)} contratado` : "",
      `base ${formatTargetHours(targetHours)}`,
      `carga real ${occupancy}%`,
      formatUnique(rows, "site"),
      `${rooms} ${rooms === 1 ? "aula" : "aulas"}`,
      `${days} ${days === 1 ? "día" : "días"}`,
      formatUnique(rows, "shift"),
    ],
    lines: subjectSummaries(rows, 6).map(
      ({ name: subject, count, minutes }) => `${subject} · ${formatHours(minutes)} · ${count} clases`
    ),
  });
}

function buildSubjectEntity(name, rows) {
  return createEntityCard({
    kind: "subject",
    color: colorForSubject(name),
    title: name,
    label: "Asignatura",
    metric: {
      label: "Sesiones",
      value: String(rows.length),
      percent: Math.min(rows.length * 8, 100),
    },
    chips: [formatUnique(rows, "site"), formatUnique(rows, "cycle", "Ciclo"), formatUnique(rows, "room", "Aulas")],
    lines: topValues(rows, "teacher", 4).map(([teacher, count]) => `${teacher} · ${count}`),
  });
}

function createEntityCard({ title, label, chips, lines, metric = null, color = "#5a4df1", kind = "default" }) {
  const article = document.createElement("article");
  article.className = `entity-card entity-card-${kind}`;
  article.style.setProperty("--entity-color", color);

  const labelNode = document.createElement("span");
  labelNode.className = "entity-label";
  labelNode.textContent = label;

  const titleNode = document.createElement("h3");
  titleNode.textContent = title;

  const metricNode = metric ? createMetricBlock(metric) : null;
  const hero = document.createElement("header");
  hero.className = "entity-hero";
  const avatar = document.createElement("span");
  avatar.className = "entity-avatar";
  avatar.textContent = kind === "room" ? "A" : teacherInitial(title);
  const titleBlock = document.createElement("div");
  titleBlock.className = "entity-title-block";
  titleBlock.append(labelNode, titleNode);
  hero.append(avatar, titleBlock);
  if (metric) {
    const value = document.createElement("strong");
    value.className = "entity-hero-value";
    value.textContent = metric.value;
    hero.append(value);
  }

  const chipWrap = document.createElement("div");
  chipWrap.className = "entity-meta";
  chips.filter(Boolean).forEach((chip) => {
    const chipNode = document.createElement("span");
    chipNode.className = "entity-chip";
    chipNode.textContent = chip;
    chipWrap.append(chipNode);
  });

  const list = document.createElement("div");
  list.className = "entity-list";
  lines.forEach((line) => {
    const item = document.createElement("span");
    item.textContent = line;
    list.append(item);
  });

  article.append(hero);
  if (metricNode) article.append(metricNode);
  article.append(chipWrap, list);
  return article;
}

function createMetricBlock(metric) {
  const wrap = document.createElement("div");
  wrap.className = "entity-metric";

  const top = document.createElement("div");
  const label = document.createElement("span");
  label.textContent = metric.label;
  const value = document.createElement("strong");
  value.textContent = metric.value;
  top.append(label, value);

  const bar = document.createElement("div");
  bar.className = "occupancy-bar";
  const fill = document.createElement("span");
  fill.style.width = `${Math.min(metric.percent, 100)}%`;
  bar.append(fill);

  wrap.append(top, bar);
  return wrap;
}

function renderOccupancyView() {
  elements.occupancyChart.replaceChildren();
  elements.occupancyList.replaceChildren();
  const groups = groupBy(state.filteredRows, "teacher");
  const entries = getTeacherOccupancyEntries(groups);
  const filteredEntries = filterOccupancyEntries(entries);

  if (!entries.length) {
    const note = document.createElement("p");
    note.className = "muted-note";
    note.textContent = "No hay profesores con los filtros actuales.";
    elements.occupancyList.append(note);
    return;
  }

  renderOccupancyChart(filteredEntries, entries);
  if (!filteredEntries.length) {
    const note = document.createElement("p");
    note.className = "muted-note";
    note.textContent = "No hay profesores con ese porcentaje contratado.";
    elements.occupancyList.append(note);
    return;
  }

  filteredEntries
    .slice()
    .sort((a, b) => a.name.localeCompare(b.name, "es"))
    .forEach((entry) => elements.occupancyList.append(createOccupancyCard(entry.name, entry.rows)));
}

function filterOccupancyEntries(entries) {
  const maxPercent = parseContractedOccupancy(state.occupancyContractMax);
  if (!maxPercent || maxPercent >= 100) return entries;
  return entries.filter((entry) => Number.isFinite(entry.contractedPercent) && entry.contractedPercent <= maxPercent);
}

function getTeacherOccupancyEntries(groups) {
  return [...groups.entries()]
    .filter(([name]) => name !== "Sin indicar")
    .map(([name, rows]) => {
      const contractRows = contractRowsForTeacher(name);
      const totalMinutes = sumDuration(rows);
      const contractedPercent = contractedPercentForRows(contractRows);
      const targetHours = getTeacherTargetHours(name, contractRows);
      const occupancy = occupancyPercent(totalMinutes, targetHours);
      return {
        name,
        rows,
        contractRows,
        totalMinutes,
        contractedPercent,
        targetHours,
        occupancy,
      };
    });
}

function renderOccupancyChart(entries, allEntries = entries) {
  const sorted = entries
    .slice()
    .sort((a, b) => (a.contractedPercent ?? 9999) - (b.contractedPercent ?? 9999) || a.name.localeCompare(b.name, "es"));
  const contractedValues = sorted
    .map((entry) => entry.contractedPercent)
    .filter((percent) => Number.isFinite(percent) && percent > 0);
  const averageContract = contractedValues.length
    ? Math.round(contractedValues.reduce((total, percent) => total + percent, 0) / contractedValues.length)
    : null;

  const panel = document.createElement("article");
  panel.className = "occupancy-chart-panel";

  const head = document.createElement("header");
  head.className = "occupancy-chart-head";

  const copy = document.createElement("div");
  const label = document.createElement("span");
  label.className = "label";
  label.textContent = "Resumen";
  const title = document.createElement("h2");
  title.textContent = "Ocupación contratada por profesor";
  const text = document.createElement("p");
  const detectedValues = [
    ...new Set(
      allEntries
        .map((entry) => entry.contractedPercent)
        .filter((percent) => Number.isFinite(percent) && percent > 0)
    ),
  ].sort((a, b) => a - b);
  text.textContent = `La gráfica toma la columna Ocupación contratada de todo el CSV del profesor, aunque haya filtros activos. Valores detectados: ${
    detectedValues.length ? detectedValues.map(formatPercent).join(", ") : "sin datos"
  }.`;
  copy.append(label, title, text);

  const tools = document.createElement("div");
  tools.className = "occupancy-chart-tools";

  const kpis = document.createElement("div");
  kpis.className = "occupancy-chart-kpis";
  [
    ["Profesores mostrados", String(sorted.length)],
    ["Media contrato", averageContract === null ? "-" : `${averageContract}%`],
  ].forEach(([name, value]) => {
    const item = document.createElement("div");
    const itemLabel = document.createElement("span");
    itemLabel.textContent = name;
    const itemValue = document.createElement("strong");
    itemValue.textContent = value;
    item.append(itemLabel, itemValue);
    kpis.append(item);
  });
  tools.append(kpis, createOccupancyPercentFilter(allEntries.length));

  head.append(copy, tools);

  const list = document.createElement("div");
  list.className = "occupancy-chart-list";
  if (sorted.length) {
    sorted.forEach((entry) => list.append(createOccupancyChartRow(entry)));
  } else {
    const note = document.createElement("p");
    note.className = "muted-note";
    note.textContent = "Ajusta el filtro para ver resultados.";
    list.append(note);
  }

  panel.append(head, list);
  elements.occupancyChart.append(panel);
}

function createOccupancyPercentFilter(totalEntries) {
  const form = document.createElement("form");
  form.className = "occupancy-percent-filter";

  const label = document.createElement("label");
  const labelText = document.createElement("span");
  labelText.textContent = "Filtrar contrato hasta";
  const input = document.createElement("input");
  input.type = "number";
  input.min = "1";
  input.max = "100";
  input.step = "1";
  input.placeholder = "Ej. 50";
  input.value = state.occupancyContractMax;
  label.append(labelText, input);

  const submit = document.createElement("button");
  submit.type = "submit";
  submit.textContent = "Aplicar";

  const clear = document.createElement("button");
  clear.type = "button";
  clear.textContent = "Limpiar";
  clear.disabled = !state.occupancyContractMax;

  const help = document.createElement("p");
  const maxPercent = parseContractedOccupancy(state.occupancyContractMax);
  help.textContent = maxPercent
    ? `Mostrando ${filterOccupancyEntries(getTeacherOccupancyEntries(groupBy(state.filteredRows, "teacher"))).length} de ${totalEntries} profesores con ${formatPercent(maxPercent)} o menos.`
    : "Escribe 50 para ver profesores con 50% o menos.";

  form.addEventListener("submit", (event) => {
    event.preventDefault();
    state.occupancyContractMax = clean(input.value);
    render();
  });
  clear.addEventListener("click", () => {
    state.occupancyContractMax = "";
    render();
  });

  form.append(label, submit, clear, help);
  return form;
}

function createOccupancyChartRow(entry) {
  const row = document.createElement("div");
  row.className = "occupancy-chart-row";
  row.classList.toggle("is-missing", !entry.contractedPercent);
  row.style.setProperty("--bar-width", `${Math.min(entry.contractedPercent || 0, 100)}%`);

  const top = document.createElement("div");
  top.className = "occupancy-chart-row-top";

  const name = document.createElement("strong");
  name.textContent = entry.name;
  const value = document.createElement("span");
  value.textContent = entry.contractedPercent ? formatPercent(entry.contractedPercent) : "Sin dato";
  top.append(name, value);

  const track = document.createElement("div");
  track.className = "occupancy-chart-track";
  const fill = document.createElement("span");
  fill.className = "occupancy-chart-fill";
  track.append(fill);

  const meta = document.createElement("p");
  meta.textContent = [
    "Columna Ocupación contratada",
    `${formatHours(entry.totalMinutes)} de clase`,
    `base ${formatTargetHours(entry.targetHours)}`,
    `carga real ${entry.occupancy}%`,
    `${entry.rows.length} clases`,
  ].join(" · ");

  row.append(top, track, meta);
  return row;
}

function createOccupancyCard(name, rows) {
  const totalMinutes = sumDuration(rows);
  const contractRows = contractRowsForTeacher(name);
  const contractedPercent = contractedPercentForRows(contractRows);
  const targetHours = getTeacherTargetHours(name, contractRows);
  const occupancy = occupancyPercent(totalMinutes, targetHours);
  const article = document.createElement("article");
  article.className = "occupancy-card";

  const header = document.createElement("header");
  const title = document.createElement("h3");
  title.textContent = name;
  const total = document.createElement("strong");
  total.textContent = formatHours(totalMinutes);
  header.append(title, total);

  const contractBlock = createContractBlock({ contractedPercent, targetHours, totalMinutes, occupancy, name, rows: contractRows });

  const metric = createMetricBlock({
    label: contractedPercent
      ? `Cálculo con contrato CSV: ${formatHours(totalMinutes)} / ${formatTargetHours(targetHours)}`
      : `Ocupación sobre ${formatTargetHours(targetHours)}`,
    value: `${occupancy}%`,
    percent: occupancy,
  });

  const list = document.createElement("div");
  list.className = "entity-list";
  subjectSummaries(rows, 5).forEach(({ name: subject, count, minutes }) => {
    const item = document.createElement("span");
    item.textContent = `${subject} · ${formatHours(minutes)} · ${count} clases`;
    list.append(item);
  });

  article.append(header, contractBlock, metric, list);
  return article;
}

function createContractBlock({ contractedPercent, targetHours, totalMinutes, occupancy, name, rows = [] }) {
  if (contractedPercent) {
    const block = document.createElement("div");
    block.className = "contract-block";

    const percent = document.createElement("strong");
    percent.textContent = `Ocupación contratada CSV: ${formatPercent(contractedPercent)}`;

    const base = document.createElement("span");
    base.textContent = `Base calculada: ${formatTargetHours(targetHours)} de ${defaultWeeklyTargetHours} h`;

    const calc = document.createElement("span");
    calc.textContent = `Cálculo: ${formatHours(totalMinutes)} / ${formatTargetHours(targetHours)} = ${occupancy}%`;

    block.append(percent, base, calc);
    const csvValues = contractedValuesForRows(rows);
    if (csvValues.length > 1) {
      const values = document.createElement("span");
      values.textContent = `Valores detectados en CSV: ${csvValues.map(formatPercent).join(", ")} · usado ${formatPercent(contractedPercent)}`;
      block.append(values);
    }
    return block;
  }

  const control = document.createElement("label");
  control.className = "target-control";
  const label = document.createElement("span");
  label.textContent = "Base h/semana";
  const input = document.createElement("input");
  input.type = "number";
  input.min = "1";
  input.max = "60";
  input.step = "0.5";
  input.value = String(targetHours);
  input.addEventListener("change", () => updateTeacherTarget(name, input.value));
  control.append(label, input);
  return control;
}

function updateTeacherTarget(name, rawValue) {
  const value = Number(rawValue);
  if (!Number.isFinite(value) || value <= 0) {
    delete state.teacherTargets[name];
  } else {
    state.teacherTargets[name] = value;
  }
  saveTeacherTargets();
  render();
}

function renderAvailabilityView() {
  elements.availabilityResult.replaceChildren();
  if (!state.allRows.length) return;

  const day = elements.freeDaySelect.value || elements.dayFilter.value || dayOrder[0];
  const time =
    elements.freeTimeSelect.value ||
    [...new Set(state.allRows.map((row) => row.time).filter(Boolean))].sort((a, b) => timeToMinutes(a) - timeToMinutes(b))[0];
  const site = elements.freeSiteSelect.value || elements.sedeFilter.value;

  if (!elements.freeDaySelect.value) elements.freeDaySelect.value = day;
  if (!elements.freeTimeSelect.value) elements.freeTimeSelect.value = time;
  if (site && !elements.freeSiteSelect.value) elements.freeSiteSelect.value = site;

  const rooms = roomOptionsForSite(site);
  if (day === "__all__") {
    renderAllDaysAvailability({ time, site, rooms });
    return;
  }

  if (time === "__all__") {
    renderAllDayAvailability({ day, site, rooms });
    return;
  }

  const busyRows = state.allRows.filter((row) => row.day === day && row.time === time && (!site || row.site === site));
  const busyRooms = new Set(busyRows.map(roomAvailabilityKey));
  const freeRooms = rooms.filter((room) => !busyRooms.has(room.key));

  const summary = document.createElement("article");
  summary.className = "availability-summary";
  const title = document.createElement("h3");
  title.textContent = `${freeRooms.length} aulas libres`;
  const meta = document.createElement("p");
  meta.textContent = `${day} · ${time}${site ? ` · ${site}` : " · Todas las sedes"}`;
  const answer = document.createElement("p");
  answer.className = "availability-answer";
  answer.textContent = freeRooms.length
    ? `Aulas libres: ${freeRooms.map((room) => formatRoomOption(room, site)).join(", ")}`
    : "No hay aulas libres en esa franja.";
  summary.append(title, meta, answer);

  const freeList = document.createElement("div");
  freeList.className = "room-chip-list";
  freeRooms.forEach((room) => {
    const chip = document.createElement("span");
    chip.textContent = formatRoomOption(room, site);
    freeList.append(chip);
  });

  const busyTitle = document.createElement("h3");
  busyTitle.className = "availability-subtitle";
  busyTitle.textContent = `${busyRooms.size} aulas ocupadas`;

  const busyList = document.createElement("div");
  busyList.className = "busy-list";
  busyRows
    .sort(sortSessions)
    .forEach((row) => {
      const item = document.createElement("article");
      item.style.setProperty("--session-color", colorForSubject(row.subject));
      item.innerHTML = `<strong>${escapeHtml(row.room)}</strong><span>${escapeHtml(row.subject || "Sin asignatura")}</span><small>${escapeHtml(row.teacher || "Profesor sin indicar")}</small>`;
      busyList.append(item);
    });

  elements.availabilityResult.append(summary, freeList, busyTitle, busyList);
}

function renderAllDayAvailability({ day, site, rooms }) {
  const times = [...new Set(state.allRows.filter((row) => row.day === day && (!site || row.site === site)).map((row) => row.time))]
    .sort((a, b) => timeToMinutes(a) - timeToMinutes(b));
  const freeByRoom = rooms
    .map((room) => {
      const freeTimes = times.filter((time) => {
        return !state.allRows.some(
          (row) => row.day === day && row.time === time && row.site === room.site && row.room === room.room
        );
      });
      return { ...room, freeTimes };
    })
    .filter((room) => room.freeTimes.length);

  const summary = document.createElement("article");
  summary.className = "availability-summary";
  const title = document.createElement("h3");
  title.textContent = `${freeByRoom.length} aulas con huecos libres`;
  const meta = document.createElement("p");
  meta.textContent = `${day} · Todas las horas${site ? ` · ${site}` : " · Todas las sedes"}`;
  const answer = document.createElement("p");
  answer.className = "availability-answer";
  answer.textContent = freeByRoom.length
    ? `Aulas con horas libres: ${freeByRoom.map((room) => formatRoomOption(room, site)).join(", ")}`
    : "No hay aulas libres en ese día.";
  summary.append(title, meta, answer);

  const list = document.createElement("div");
  list.className = "free-room-hours-list";
  freeByRoom.forEach((room) => {
    const card = document.createElement("article");
    const title = document.createElement("strong");
    title.textContent = formatRoomOption(room, site);
    const meta = document.createElement("span");
    meta.textContent = room.floor ? `Planta ${room.floor}` : "Planta sin indicar";
    const hours = document.createElement("p");
    hours.textContent = `Horas libres: ${room.freeTimes.join(", ")}`;
    card.append(title, meta, hours);
    list.append(card);
  });

  elements.availabilityResult.append(summary, list);
}

function renderAllDaysAvailability({ time, site, rooms }) {
  if (time === "__all__") {
    renderFullWeekAvailability({ site, rooms });
    return;
  }

  const freeByRoom = rooms
    .map((room) => {
      const freeDays = dayOrder.filter((day) => {
        return !state.allRows.some(
          (row) => row.day === day && row.time === time && row.site === room.site && row.room === room.room
        );
      });
      return { ...room, freeDays };
    })
    .filter((room) => room.freeDays.length);

  summary.className = "availability-summary";
  const title = document.createElement("h3");

  const answer = document.createElement("p");

  answer.textContent = freeByRoom.length
    ? `Aulas con días libres: ${freeByRoom.map((room) => formatRoomOption(room, site)).join(", ")}`
    : "No hay aulas libres para esa hora.";

    card.append(title, meta, days);
    list.append(card);

function renderFullWeekAvailability({ site, rooms }) {
  const freeByRoom = rooms
    .map((room) => {
      const freeSlots = dayOrder.flatMap((day) => {
        const times = [...new Set(state.allRows.filter((row) => row.day === day && row.site === room.site).map((row) => row.time))]
          .sort((a, b) => timeToMinutes(a) - timeToMinutes(b));
        return times
          .filter((time) => {
            return !state.allRows.some(
              (row) => row.day === day && row.time === time && row.site === room.site && row.room === room.room
            );
          })
          .map((time) => `${day} ${time}`);
      });
      return { ...room, freeSlots };
    })
    .filter((room) => room.freeSlots.length);

    card.append(title, meta, slots);
    list.append(card);
  });

  elements.availabilityResult.append(summary, list);
}

function roomOptionsForSite(site) {
  const options = new Map();
  state.allRows
    .filter((row) => (!site || row.site === site) && row.room !== "Sin aula")
    .forEach((row) => {
      const key = roomAvailabilityKey(row);
      if (!options.has(key)) {
        options.set(key, { key, room: row.room, site: row.site, floor: row.floor });
      }
    });
  return [...options.values()].sort(
    (a, b) => a.site.localeCompare(b.site, "es") || a.room.localeCompare(b.room, "es")
  );
}

function roomAvailabilityKey(row) {
  return `${row.site}|${row.room}`;
}

function formatRoomOption(option, selectedSite = "") {
  return selectedSite ? option.room : `${option.room} (${option.site})`;
}

function roomOccupiedSlots(rows) {
  return new Set(rows.map((row) => `${row.day}|${row.time}`)).size;
}

function roomCapacitySlots(roomName, rows) {
  const site = rows.find((row) => row.room === roomName)?.site;
  const siteRows = state.allRows.filter((row) => !site || row.site === site);
  return new Set(siteRows.map((row) => `${row.day}|${row.time}`)).size;
}

function formatUnique(rows, key, prefix = "") {
  const values = unique(rows, key);
  if (!values.length) return "";
  const text = values.length <= 2 ? values.join(", ") : `${values.length} ${prefix || "valores"}`;
  if (prefix && values.length > 2) return text;
  return prefix && values.length <= 2 ? `${prefix}: ${text}` : text;
}

function sumDuration(rows) {
  return rows.reduce((total, row) => total + (row.durationMinutes || defaultClassMinutes), 0);
}

function formatHours(minutes) {
  const hours = Math.floor(minutes / 60);
  const rest = minutes % 60;
  if (!hours) return `${rest} min`;
  return rest ? `${hours} h ${rest} min` : `${hours} h`;
}

function getTeacherTargetHours(name, rows = []) {
  const contractedPercent = contractedPercentForRows(rows);
  if (!isTeacherPortal && contractedPercent) {
    return (defaultWeeklyTargetMinutes * contractedPercent) / 100 / 60;
  }
  const configured = Number(state.teacherTargets[name]);
  if (Number.isFinite(configured) && configured > 0) return configured;
  return defaultWeeklyTargetHours;
}

function formatTargetHours(hours) {
  return Number.isInteger(hours) ? `${hours} h` : `${hours.toString().replace(".", ",")} h`;
}

function formatPercent(percent) {
  return `${Number.isInteger(percent) ? percent : percent.toFixed(1).replace(".", ",")}%`;
}

function contractedPercentForRows(rows) {
  const values = rows
    .slice()
    .sort((a, b) => (a.sourceIndex ?? 0) - (b.sourceIndex ?? 0))
    .map((row) => row.contractedOccupancyPercent)
    .filter((percent) => Number.isFinite(percent) && percent > 0);
  if (!values.length) return null;
  const distinct = [...new Set(values)];
  if (distinct.length === 1) return distinct[0];

  const changedValues = distinct.filter((percent) => percent !== 30);
  if (changedValues.length === 1) return changedValues[0];

  const lastChangedValue = values.slice().reverse().find((percent) => percent !== 30);
  return lastChangedValue || values[values.length - 1];
}

function contractedValuesForRows(rows) {
  return [
    ...new Set(
      rows
        .map((row) => row.contractedOccupancyPercent)
        .filter((percent) => Number.isFinite(percent) && percent > 0)
    ),
  ].sort((a, b) => a - b);
}

function occupancyPercent(minutes, targetHours) {
  return Math.round((minutes / (targetHours * 60)) * 100);
}

function subjectSummaries(rows, limit) {
  const groups = rows.reduce((map, row) => {
    const name = row.subject || "Sin asignatura";
    const current = map.get(name) || { name, count: 0, minutes: 0 };
    current.count += 1;
    current.minutes += row.durationMinutes || defaultClassMinutes;
    map.set(name, current);
    return map;
  }, new Map());
  return [...groups.values()]
    .sort((a, b) => b.minutes - a.minutes || b.count - a.count || a.name.localeCompare(b.name, "es"))
    .slice(0, limit);
}

function topValues(rows, key, limit) {
  const counts = rows.reduce((map, row) => {
    const value = row[key] || "Sin indicar";
    map.set(value, (map.get(value) || 0) + 1);
    return map;
  }, new Map());
  return [...counts.entries()]
    .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], "es"))
    .slice(0, limit);
}

function clearFilters() {
  filterControls.forEach((control) => {
    control.value = "";
  });
  elements.searchInput.value = "";
  state.occupancyContractMax = "100";
  render();
}

function escapeHtml(value = "") {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}
